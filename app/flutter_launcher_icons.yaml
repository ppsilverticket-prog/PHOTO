# 앱 아이콘 설정. 원본은 tool/generate_brand_assets.dart 가 만든다.
# 재생성: dart run tool/generate_brand_assets.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png

  android: true
  # 어댑티브 아이콘: 크림 배경 + 투명 전경(스파클만)
  adaptive_icon_background: "#FFF7F2"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

  ios: true
  # iOS는 알파 채널이 있으면 스토어 심사에서 거부된다.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFF7F2"
    theme_color: "#FF8E78"
