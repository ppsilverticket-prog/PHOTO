name: photo_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  # 하한 3.11: CI는 Flutter 3.44(Dart 3.12)로 빌드하지만, 로컬 개발은
  # brew의 Flutter 3.41(Dart 3.11)에서도 가능해야 한다.
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  gal: ^2.3.3
  google_mlkit_face_detection: ^0.14.0
  image: ^4.9.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/adjustments.frag
  fonts:
    # Pretendard (SIL OFL) — https://github.com/orioncactus/pretendard
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
